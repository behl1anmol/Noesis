[project]
name = "noesis"
version = "0.1.0"
description = "Noesis — local hybrid code-retrieval service for AI agents (MCP primary, REST secondary)"
readme = "README.md"
authors = [
    { name = "Anmol", email = "behl1anmol@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ast-grep-py==0.44.0",
    "einops>=0.8.2",
    # ADR-86: promoted from transitive (huggingface-hub and torch both already
    # depend on it) to direct, for the shim's server election. Adds no
    # supply-chain surface, only a direct import boundary and the decision row
    # hard rule 3 requires - the same promotion ADR-78 made for huggingface_hub.
    # Floor is the version this project already resolves and that the election
    # was verified against; a lower bound would be an untested claim.
    "filelock>=3.29.5",
    "fastapi[standard]>=0.139.0",
    "fastmcp>=3.4.2,<4",
    # ADR-78 (issue #47): promoted from transitive (sentence-transformers,
    # fastembed both already depend on it) to direct, for a no-network
    # local-cache presence check surfaced on /healthz. Adds no new
    # supply-chain surface, only a direct import boundary.
    "huggingface-hub>=1.20.0",
    "jinja2>=3.1.6",
    "pathspec>=1.1.1",
    # Upper bound is the coupling to docker-compose.yml's server tag, not a
    # known defect in 1.19: the client vouches for a server at most one minor
    # away, so an unreviewed client bump would re-open the skew ADR-62 closed.
    # Both pins move in one commit, or the pin-compat test fails.
    "qdrant-client[fastembed]>=1.18.0,<1.19",
    "sentence-transformers>=5.6.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.12.2",
    "watchdog>=6.0.0",
]

[tool.uv]
# CLAUDE.md rule 5: fastmcp resolves the mcp SDK; never float past <2 until
# the M8 checkpoint decides. This makes the rule mechanical at resolve time.
constraint-dependencies = ["mcp<2"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "astchunk>=0.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
]
# Docs build only (GitHub Pages). Never a runtime dep — ADR-50.
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: loads the real embedding model (slow, large download); run with -m integration",
    "golden: M3 eval harness — self-indexes this repo with the real model; run with -m golden -s (pytest's stdout capture eats the progress prints without -s)",
    "server: needs a live Qdrant server (docker compose up -d); run with -m server",
]
addopts = "-m 'not integration and not golden and not server'"
